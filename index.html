<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist de Ações Comerciais</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1f2430;--mut:#6b7385;--bd:#dde1e8;--pri:#2a5bd7;--ok:#1e8e4e;--okbg:#e6f5ec}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1d222b;--tx:#e8ebf0;--mut:#98a1b3;--bd:#2d3441;--pri:#6e9bff;--ok:#4cc27f;--okbg:#17301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{padding:16px;max-width:900px;margin:auto}
h1{font-size:20px;margin:0 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:auto;padding:0 16px 40px}
.squad{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:16px;overflow:hidden}
.squad>h2{margin:0;padding:12px 14px;font-size:16px;display:flex;justify-content:space-between;border-bottom:1px solid var(--bd)}
.squad>h2 span{color:var(--mut);font-weight:400;font-size:13px}
.item{padding:12px 14px;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}
.item.done{background:var(--okbg)}
.top{display:flex;gap:10px;align-items:flex-start}
.top input[type=checkbox]{width:20px;height:20px;margin-top:2px;flex:none}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0 30px;align-items:center}
.meta input[type=text]{width:170px}.meta input[type=date]{width:150px}
.meta textarea{flex:1 1 100%;min-height:36px;resize:vertical}
.file{font-size:13px;color:var(--mut)}
.file a{color:var(--pri)}
.tag{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header>
  <h1>Checklist de Ações — Time Comercial</h1>
  <div class="bar">
    <select id="sel" aria-label="Ação"></select>
    <button id="nova">+ Nova ação</button>
    <button id="exp">Exportar backup</button>
    <button id="imp">Importar backup</button>
    <button id="del">Excluir ação</button>
    <input type="file" id="impf" accept=".json" hidden>
  </div>
  <p class="tag">Etapa 2 · O registro (anexo/observação) é opcional. Os dados ficam salvos neste navegador; use "Exportar backup" para guardar ou compartilhar.</p>
</header>
<main id="main"></main>
<script>
const COMUM=['SALÃO','INÍCIOS','REINÍCIOS','BASE AMPLA','BASE VIP'];
const T_COM=[
 ['com1','Garantir uma comunicação clara e assertiva com todo o time, assegurando que todos estejam cientes das mecânicas da ação.'],
 ['com2','Garantir uma comunicação clara com o time do FVC para divulgação em massa da ação junto à comunicação do estoque.'],
 ['com3','Verificar a efetividade da ação por meio do painel de ações.']];
const SQUADS=[
 {id:'estoque',nome:'SQUAD ESTOQUE',tarefas:[['est1','Verificação e separação dos produtos da ação e transferência para o salão de vendas.']]},
 {id:'lideres',nome:'LÍDERES DE VENDAS',tarefas:[
  ['lid1','Testar a ação para entender gargalos, possíveis problemas ou oportunidades.'],
  ['lid2','Estar ciente e entender a meta da ação e repassar para o time.']]},
 ...COMUM.map(n=>({id:n.toLowerCase().replace(/\s/g,'_').normalize('NFD').replace(/[̀-ͯ]/g,''),nome:'SQUAD '+n,
   tarefas:[...(n==='SALÃO'?[['sal1','Organização e demonstração dos produtos de forma atrativa para os revendedores.']]:[]),...T_COM]}))
];
const KEY='checklist_acoes_v1', MAXF=1.5*1024*1024;
let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!db.acoes)db={atual:null,acoes:{}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Não foi possível salvar (armazenamento cheio). Exporte um backup e remova anexos grandes.')}};
const $=s=>document.querySelector(s);
const hoje=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function nova(){
  const n=prompt('Nome da ação (ex.: Ação de Fluxo - Nov/26):');if(!n)return;
  const id='a'+Date.now();db.acoes[id]={nome:n,itens:{}};db.atual=id;save();render();
}
function render(){
  const ids=Object.keys(db.acoes);
  if(!ids.length){$('#main').innerHTML='<p>Crie sua primeira ação em “+ Nova ação”.</p>';$('#sel').innerHTML='';return}
  if(!db.acoes[db.atual])db.atual=ids[0];
  $('#sel').innerHTML=ids.map(i=>`<option value="${i}" ${i===db.atual?'selected':''}>${esc(db.acoes[i].nome)}</option>`).join('');
  const a=db.acoes[db.atual];
  $('#main').innerHTML=SQUADS.map(s=>{
    const feitos=s.tarefas.filter(t=>a.itens[s.id+'|'+t[0]]?.done).length;
    return `<section class="squad"><h2>${s.nome}<span>${feitos}/${s.tarefas.length} concluídos</span></h2>`+
    s.tarefas.map(([tid,txt])=>{
      const k=s.id+'|'+tid,it=a.itens[k]||{};
      return `<div class="item ${it.done?'done':''}"><label class="top"><input type="checkbox" data-k="${k}" data-f="done" ${it.done?'checked':''}><span>${txt}</span></label>
      <div class="meta">
        <input type="date" data-k="${k}" data-f="data" value="${it.data||''}" aria-label="Data">
        <input type="text" data-k="${k}" data-f="por" value="${esc(it.por)}" placeholder="Feito por" aria-label="Feito por">
        <label class="file">📎 Registro (opcional): <input type="file" data-k="${k}" data-f="file" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx"></label>
        ${it.file?`<span class="file"><a href="${it.file.data}" download="${esc(it.file.name)}">${esc(it.file.name)}</a> <button data-k="${k}" data-rm="1">remover</button></span>`:''}
        <textarea data-k="${k}" data-f="obs" placeholder="Observação (opcional)">${esc(it.obs)}</textarea>
      </div></div>`}).join('')+'</section>'}).join('');
}
document.addEventListener('change',e=>{
  const el=e.target,k=el.dataset.k;
  if(el.id==='sel'){db.atual=el.value;save();return render()}
  if(!k)return;
  const a=db.acoes[db.atual],it=a.itens[k]=a.itens[k]||{};
  const f=el.dataset.f;
  if(f==='done'){it.done=el.checked;if(el.checked&&!it.data)it.data=hoje();if(el.checked&&!it.por){const u=localStorage.getItem('checklist_user')||'';it.por=u}}
  else if(f==='file'){
    const file=el.files[0];if(!file)return;
    if(file.size>MAXF){alert('Arquivo acima de 1,5 MB. Reduza ou use um print menor.');el.value='';return}
    const r=new FileReader();r.onload=()=>{it.file={name:file.name,data:r.result};save();render()};r.readAsDataURL(file);return;
  }
  else{it[f]=el.value;if(f==='por')try{localStorage.setItem('checklist_user',el.value)}catch(e){}}
  save();render();
});
document.addEventListener('click',e=>{
  if(e.target.dataset.rm){delete db.acoes[db.atual].itens[e.target.dataset.k].file;save();render()}
});
$('#nova').onclick=nova;
$('#del').onclick=()=>{if(db.atual&&confirm('Excluir esta ação e todos os registros dela?')){delete db.acoes[db.atual];db.atual=null;save();render()}};
$('#exp').onclick=()=>{
  const b=new Blob([JSON.stringify(db)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');
  l.href=u;l.download='checklist_backup_'+hoje()+'.json';l.click();URL.revokeObjectURL(u)};
$('#imp').onclick=()=>$('#impf').click();
$('#impf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.acoes)throw 0;Object.assign(db.acoes,d.acoes);db.atual=db.atual||d.atual;save();render()}catch(x){alert('Arquivo inválido.')}};r.readAsText(f)};
render();
</script>
</body>
</html>
